[project]
name = "academy-python"
version = "0.1.0"
description = "Standalone Python, FastAPI and SQLAlchemy learning laboratory"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.115",
    "pydantic>=2,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.54.0",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
